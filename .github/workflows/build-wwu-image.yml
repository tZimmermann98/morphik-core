name: Build WWU GPU image

# Builds the single image the WWU cluster runs. Both morphik-api and
# morphik-worker use the same image (harbor.uni-muenster.de/ki/morphik-gpu),
# so there is exactly one artifact to produce — no CPU/slim variant, no
# multi-arch matrix. The cluster is linux/amd64.
#
# Required repository secrets:
#   HARBOR_USERNAME  - Harbor robot account, e.g. robot$ki+github
#   HARBOR_PASSWORD  - that robot account's secret
#
# The Harbor project "ki" is public for pulls, so the cluster needs no change;
# the credentials are only needed to push.

on:
  # Push trigger: workflow_dispatch only offers a "Run workflow" button when the
  # workflow file is on the repository's DEFAULT branch, and this lives on a
  # feature branch. Push events run the workflow from the branch it sits on, so
  # this is what actually makes the build triggerable before the branch merges.
  push:
    branches:
      - "wwu/upgrade-**"
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (default: upstream-2026-07)"
        required: false
        type: string
      push:
        description: "Push to Harbor (uncheck to build only)"
        required: false
        default: true
        type: boolean

concurrency:
  group: wwu-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The nvcr.io PyTorch base is ~11 GB compressed (~20 GB extracted) and the
      # resulting image is ~15 GB, so the default free space is not enough.
      # Reclaim everything the Docker build does not need.
      - name: Free up disk space
        run: |
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /usr/local/julia* \
                      /usr/share/miniconda /usr/local/graalvm \
                      /usr/local/share/chromium /opt/hostedtoolcache
          sudo apt-get clean
          sudo docker system prune -af
          echo "=== after ==="; df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push events carry no inputs, so fall back to the release tag.
      # Bump this when the image content changes rather than overwriting a tag
      # that running pods reference: with imagePullPolicy IfNotPresent an
      # overwritten tag silently stops matching the digest actually running, and
      # the previous tag stays valid as a rollback target.
      - name: Resolve image tag
        id: meta
        run: echo "tag=${{ inputs.tag || 'upstream-2026-07-video' }}" >> "$GITHUB_OUTPUT"

      # Only Harbor needs credentials: nvcr.io hands out anonymous pull tokens
      # for nvidia/pytorch, so no NGC account or secret is required.
      - name: Log in to Harbor
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: harbor.uni-muenster.de
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile.wwu
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: harbor.uni-muenster.de/ki/morphik-gpu:${{ steps.meta.outputs.tag }}
          # Registry cache keeps repeat builds cheap; the expensive layer is
          # `uv sync` (torch 2.8 + CUDA wheels), not flash-attn, which now comes
          # from a prebuilt wheel.
          cache-from: type=registry,ref=harbor.uni-muenster.de/ki/morphik-gpu:buildcache
          cache-to: type=registry,ref=harbor.uni-muenster.de/ki/morphik-gpu:buildcache,mode=max
          provenance: false

      - name: Report pushed image
        if: success()
        run: |
          TAG='${{ steps.meta.outputs.tag }}'
          echo "image: harbor.uni-muenster.de/ki/morphik-gpu:$TAG"
          echo "digest: ${{ steps.build.outputs.digest }}"
          # The ki project is public for reads, so confirm the tag is actually
          # retrievable rather than trusting the push step's exit code.
          curl -sS --max-time 60 \
            "https://harbor.uni-muenster.de/api/v2.0/projects/ki/repositories/morphik-gpu/artifacts/$TAG?with_tag=true" \
            | head -c 400 || echo "(harbor readback failed - check manually)"

      - name: Report disk usage
        if: always()
        run: df -h /
